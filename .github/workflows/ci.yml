name: CI

# Documentation-only changes skip the run.
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # MyGo needs no cgo, so Linux checks the macOS code too (GOOS=darwin), and
    # runs the views without a window (ui.Tester).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The views lay out text with Pango on Linux, as GTK apps do.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpangocairo-1.0-0
      - run: go vet ./...
      - run: GOOS=darwin go vet ./...
      - run: go tool mygo vet .
      - run: go test -race ./...
